services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expose
      POSTGRES_PASSWORD: expose_local_only
      POSTGRES_DB: expose
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["expose_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expose -d expose"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  expose_pg:
